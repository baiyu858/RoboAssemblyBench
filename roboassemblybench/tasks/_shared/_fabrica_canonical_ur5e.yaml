    position: [0.58, -0.80, 0.998]
    orientation: [1.0, 0.0, 0.0, 0.0]
    apply_workspace_offset: false
    end_effector_prim_name: Gripper/Robotiq_2F_85/base_link
    ik_base_prim_name: base_link
    gripper_dof_name: finger_joint
    gripper_open_position: 0.0
    gripper_closed_position: 0.80
    hand_link_name: wrist_3_link
    left_finger_link_name: left_inner_finger
    right_finger_link_name: right_inner_finger
    gripper_xform_orient: [0.707106781, -0.707106781, 0.0, 0.0]
    configure_gripper_mount_joint: true
    gripper_base_link_path: Gripper/Robotiq_2F_85/base_link
    gripper_container_path: Gripper
    gripper_container_orient: [0.707106781, -0.707106781, 0.0, 0.0]
    gripper_mount_local_pos0: [0.0, 0.0, 0.0]
    gripper_mount_local_pos1: [0.0, 0.0, 0.0]
    gripper_mount_local_rot0: [0.0, 0.0, 0.0, -1.0]
