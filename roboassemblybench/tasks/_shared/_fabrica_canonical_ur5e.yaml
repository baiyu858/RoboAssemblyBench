extends: _dual_franka_assembly_base.yaml

scene_profile: taoyuan_grscenes_tabletop
scene_asset_path: ${ISAAC_ASSETS_ROOT}/Isaac/Environments/Simple_Warehouse/warehouse_with_forklifts.usd
scene_asset_fallback_path: ${BENCHMARK_ROOT}/scenes/usd/factory_cell.usda
max_steps: 22000
phase_timeout_steps: 1200
phase_timeout_action: fail
source_benchmark: fabrica

fabrica_canonical:
  stabilize_fixture_parts: true
  pickup_layout_offset: [0.0, 0.0, 0.0]
  base_grasp_minimum_support_clearance_ratio: 0.70
  move_grasp_minimum_relative_orientation_continuity: 0.90
  move_grasp_ik_position_tolerance: 0.01
  move_grasp_ik_orientation_tolerance: 0.03
  move_grasp_ik_max_iterations: 200
  move_grasp_ik_minimum_manipulability: 0.08
  move_grasp_ik_lift_distance: 0.10
  move_grasp_fixture_footprint_margin: 0.035
  move_grasp_minimum_fixture_clearance: 0.001
  transport_clearance_height: 0.34
  transport_timeout_steps: 4800
  insertion_timeout_steps: 3600
  base_place_timeout_steps: 4800
  move_above_timeout_steps: 3600
  move_above_orientation_first: false
  move_above_orientation_first_steps: 720
  move_above_orientation_first_tolerance: 0.08
  move_above_prealign_steps: 240
  prealign_joint_positions_by_robot:
    franka_left: [-1.9, -1.5707963268, 1.5707963268, -1.5707963268, -1.5707963268, 0.0]
    franka_right: [1.85, -1.5707963268, 1.5707963268, -1.5707963268, -1.5707963268, 0.0]
  preshape_timeout_steps: 720
  preshape_open_margin: 0.20
  preshape_gripper_position_tolerance: 0.025
  fixture_release_after_steps: 8
  descend_position_tolerance: 0.007
  descend_relaxed_position_tolerance: 0.018
  descend_relaxed_after_steps: 600
  insertion_lateral_position_tolerance: 0.001
  # Allow axial progress throughout the declared geometric capture band. At
  # lower control rates, sub-millimetre contact jitter must not keep the
  # controller permanently trapped in lateral-only alignment.
  insertion_lateral_alignment_enter_tolerance_ratio: 1.0
  insertion_lateral_tolerance_object_extent_scale: 0.04
  intermediate_insertion_lateral_position_tolerance: 0.002
  insertion_cartesian_position_step: 0.00025
  insertion_axial_recovery_cartesian_position_step: 0.001
  insertion_axial_recovery_deadband: 0.0005
  insertion_compliance_capture_max_linear_speed: 0.10
  insertion_compliance_capture_max_angular_speed: 2.0
  insertion_compliance_capture_stable_steps: 8
  insertion_compliance_geometric_capture_after_steps: 1200
  insertion_compliance_minimum_gravity_alignment: 0.70
  insertion_capture_keep_fixed_until_release_lock: true
  insertion_compliant_alignment_retraction_limit: 0.006
  insertion_compliant_track_object_orientation: true
  insertion_lateral_alignment_cartesian_position_step: 0.00025
  insertion_lateral_alignment_entry_clearance: 0.01
  insertion_lateral_alignment_clearance_object_extent_scale: 1.0
  intermediate_insertion_lateral_alignment_cartesian_position_step: 0.001
  base_support_release_position_tolerance: 0.012
  base_support_lateral_position_tolerance: 0.015
  base_support_lateral_alignment_enter_tolerance: 0.002
  base_support_lateral_alignment_exit_tolerance: 0.004
  base_support_lateral_alignment_cartesian_position_step: 0.002
  # Use the same geometry-derived placement envelope for the release lock as
  # the final insertion stage. Otherwise a physically seated part can be
  # detached at a strict 15 mm gate and be thrown out of the assembly.
  release_lock_uses_placement_tolerance: true
  release_retreat_distance: 0.06
  post_release_park_distance: 0.35
  post_release_park_vertical_offset: 0.02
  post_release_park_minimum_planar_radius: 0.28
  # The final retreat already leaves the completed assembly clear. A terminal
  # park has no successor and can trap a successful rollout at an unreachable
  # relative Cartesian target, so finish immediately after that retreat.
  skip_terminal_park: true
  # Release-and-lock already verifies that every part is released and static.
  # The final retreat has no downstream safety role and can likewise turn a
  # completed assembly into a timeout near a Cartesian singularity.
  skip_terminal_retreat: true
  pickup_translation_range:
    x: [-0.08, 0.08]
    y: [-0.08, 0.08]
    z: [0.0, 0.0]
  pickup_translation_minimum_planar_distance: 0.05
  pickup_translation_maximum_planar_distance: 0.12
  assembly_translation_range:
    x: [-0.10, 0.10]
    y: [-0.10, 0.10]
    z: [0.0, 0.0]
  assembly_translation_minimum_planar_distance: 0.05
  assembly_translation_maximum_planar_distance: 0.15

metadata:
  tags:
    - fabrica
    - canonical-bundle
    - ur5e
    - robotiq-2f85
    - staged-assembly
  skill_api:
    module: toolkits.factory_dual_franka_assembly.ur5e_skill_api
    class: UR5eAssemblySkillAPI
    adapter: toolkits.factory_dual_franka_assembly.plumbers_block_ur5e_skills:UR5eAssemblyAtomicSkillAdapter
  local_skills:
    ur5e_move_above_part:
      adapter: toolkits.factory_dual_franka_assembly.plumbers_block_ur5e_skills:UR5eAssemblyAtomicSkillAdapter
      requires_held_object: false
      require_success: true
      fallback: fail
    ur5e_descend_to_grasp:
      adapter: toolkits.factory_dual_franka_assembly.plumbers_block_ur5e_skills:UR5eAssemblyAtomicSkillAdapter
      requires_held_object: false
      require_success: true
      fallback: fail
    ur5e_preshape_gripper:
      adapter: toolkits.factory_dual_franka_assembly.plumbers_block_ur5e_skills:UR5eAssemblyAtomicSkillAdapter
      requires_held_object: false
      require_success: true
      fallback: fail
    ur5e_close_gripper:
      adapter: toolkits.factory_dual_franka_assembly.plumbers_block_ur5e_skills:UR5eAssemblyAtomicSkillAdapter
      requires_held_object: false
      require_success: true
      fallback: fail
    ur5e_move_part_to_staging:
      adapter: toolkits.factory_dual_franka_assembly.plumbers_block_ur5e_skills:UR5eAssemblyAtomicSkillAdapter
      requires_held_object: false
      require_success: true
      fallback: fail
    ur5e_retreat_vertical:
      adapter: toolkits.factory_dual_franka_assembly.plumbers_block_ur5e_skills:UR5eAssemblyAtomicSkillAdapter
      requires_held_object: false
      require_success: true
      fallback: fail
    move_arm_to_joint_positions:
      adapter: toolkits.factory_dual_franka_assembly.plumbers_block_ur5e_skills:AssemblyAtomicSkillAdapter
      requires_held_object: false
      require_success: true
      fallback: fail

